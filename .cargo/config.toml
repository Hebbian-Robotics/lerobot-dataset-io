# Faster linking via mold on Linux. macOS intentionally uses its native linker.
# Linux contributors and CI runners must install mold before invoking Cargo.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
