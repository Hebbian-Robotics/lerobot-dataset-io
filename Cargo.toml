[package]
name = "lerobot-dataset-io"
description = "Rust I/O for inspecting, accessing, and creating subsets of packed LeRobot datasets"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Hebbian-Robotics/lerobot-dataset-io"
documentation = "https://docs.rs/lerobot-dataset-io"
readme = "README.md"
keywords = ["lerobot", "robotics", "dataset", "parquet"]
categories = ["science::robotics", "filesystem"]
rust-version = "1.88"
# The repository exists before the implementation is migrated. This prevents
# accidentally publishing the placeholder package.
publish = false

[dependencies]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
